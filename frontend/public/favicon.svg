<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1219" />
      <stop offset="50%" stop-color="#04090d" />
      <stop offset="100%" stop-color="#020406" />
    </linearGradient>
    <linearGradient id="slugGrad1" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="slugGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="slugCore" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="chromeEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#94a3b8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#e2e8f0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="31" fill="none" stroke="url(#chromeEdge)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="36" fill="#10b981" opacity="0.22" filter="url(#glow)" />

  <!-- 3D OpenSlug Spiral Geometry -->
  <g transform="translate(64, 64) scale(0.92) translate(-64, -64)">
    <!-- Outer Shell Flow -->
    <path d="M 64 22 C 86 22 104 38 104 60 C 104 78 90 92 74 96 C 58 100 42 94 34 82 C 26 70 28 54 38 44 C 48 34 64 34 74 42 C 82 48 84 60 78 68 C 72 76 60 78 52 72 C 48 68 48 62 52 58 C 56 54 62 56 64 60" 
          fill="none" 
          stroke="url(#slugGrad1)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Chrome Outer Rim -->
    <path d="M 64 22 C 86 22 104 38 104 60 C 104 78 90 92 74 96 C 58 100 42 94 34 82 C 26 70 28 54 38 44 C 48 34 64 34 74 42 C 82 48 84 60 78 68 C 72 76 60 78 52 72" 
          fill="none" 
          stroke="url(#chromeEdge)" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Luminous Inner Ribbon -->
    <path d="M 64 27 C 82 27 98 41 98 60 C 98 74 86 86 72 90 C 60 94 47 88 40 78 C 34 68 36 55 44 47 C 52 39 64 40 71 47 C 76 52 76 60 72 65 C 68 70 59 71 55 67" 
          fill="none" 
          stroke="url(#slugCore)" 
          stroke-width="5" 
          stroke-linecap="round" 
          opacity="0.95" />

    <!-- Core Focal Pearl -->
    <circle cx="58" cy="62" r="4.5" fill="#ffffff" filter="url(#glow)" />
  </g>
</svg>
